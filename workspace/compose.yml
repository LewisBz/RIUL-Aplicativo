version: "3.9"

services:

  backend:
    build: .

    container_name: flask_backend

    ports:
      - "5000:5000"

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - mysql

  mysql:
    image: mysql:8.4

    container_name: mysql_db

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flask_db
      MYSQL_USER: flask
      MYSQL_PASSWORD: flask

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: