<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #E0E0E0;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.05);
        }
        .gamified-shadow {
            box-shadow: 0px 8px 24px rgba(255, 184, 0, 0.15);
        }
        .input-base {
            @apply w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 font-body-md text-body-md text-on-surface;
        }
        .label-base {
            @apply block mb-2 font-label-caps text-label-caps text-on-surface-variant uppercase;
        }
        .btn-primary {
            @apply w-full py-3 px-6 rounded-lg bg-primary text-on-primary font-title-lg text-title-lg hover:bg-on-primary-fixed-variant transition-colors duration-200 shadow-md flex justify-center items-center gap-2;
        }
        .btn-secondary {
            @apply w-full py-3 px-6 rounded-lg border-2 border-secondary text-secondary font-title-lg text-title-lg hover:bg-surface-container transition-colors duration-200;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation Omitted based on Transactional Intent Rule -->
<main class="flex-grow flex items-center justify-center p-4 md:p-gutter relative overflow-hidden">
<!-- Background Pattern / Atmospheric Element -->
<div class="absolute inset-0 pointer-events-none opacity-20" style="background-image: radial-gradient(circle at 100% 0%, #7b001f 0%, transparent 50%), radial-gradient(circle at 0% 100%, #a7f0e4 0%, transparent 50%);"></div>
<div class="w-full max-w-container-max relative z-10">
<!-- Logo / Brand Header for Auth Screen -->
<div class="text-center mb-unit-8 md:mb-unit-12">
<h1 class="font-display-lg text-display-lg text-primary mb-2 tracking-tight">RIUL</h1>
<p class="font-title-lg text-title-lg text-on-surface-variant">Acceso y autenticación</p>
</div>
<!-- Validation Alert -->
<div class="max-w-4xl mx-auto mb-unit-6 md:mb-unit-8">
<div class="bg-error-container border border-error rounded-lg p-4 flex items-center gap-4 gamified-shadow">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-body-md text-body-md text-on-error-container font-semibold">Estado de validación: Solicitud pendiente de aprobación.</p>
</div>
</div>
<div class="flex flex-col gap-unit-6 max-w-xl mx-auto">
<!-- Login Column -->
<div class="glass-card rounded-xl p-unit-6 md:p-unit-8 flex flex-col h-full border-t-4 border-t-primary shadow-lg">
<div class="mb-unit-8">
<h2 class="font-headline-lg text-headline-lg md:text-headline-lg text-on-surface flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">login</span>
                            Inicio de sesión
                        </h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Accede con tu cuenta institucional.</p>
</div>
<form class="flex-grow flex flex-col gap-unit-4">
<div>
<label class="label-base" for="login-email">Correo institucional</label>
<input class="input-base" id="login-email" placeholder="ejemplo@universidad.edu.co" required="" type="email"/>
</div>
<div>
<label class="label-base" for="login-password">Contraseña</label>
<input class="input-base" id="login-password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="mt-auto pt-unit-6">
<button class="btn-primary mb-unit-4" type="submit">
                                Iniciar Sesión
                            </button>
</div>
</form>
<div class="mt-unit-4 pt-unit-4 border-t border-outline-variant text-center bg-surface-container-low rounded-lg p-4">
<p class="font-body-md text-body-md text-on-surface-variant mb-2">¿Ya tienes una cuenta institucional?</p>
<a class="font-title-lg text-title-lg text-primary hover:underline font-semibold flex items-center justify-center gap-1" href="#">
                            Login <span class="material-symbols-outlined text-sm">arrow_forward</span>
</a>
</div>
</div>
<!-- Registration Column -->
</div>
</div>
</main>
<!-- Footer Omitted based on Transactional Intent Rule to focus on form -->
</body></html>
