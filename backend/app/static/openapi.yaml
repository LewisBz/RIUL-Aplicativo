openapi: 3.0.3
info:
  title: RIUL API
  description: >
    API del módulo de autenticación de RIUL (Red de Investigación Universidad
    Libre). Registro institucional con acceso inmediato, solicitud de cuenta
    externa pendiente de aprobación y login con JWT stateless (Flask-JWT-Extended).
  version: 1.0.0

servers:
  - url: http://localhost:5000

tags:
  - name: Auth
    description: Registro, solicitud de cuenta, login e identidad
  - name: Catálogo
    description: Datos maestros públicos para formularios
  - name: Perfil
    description: Perfil, dashboard y publicaciones propias
  - name: Feed
    description: Publicaciones de la comunidad
  - name: Semilleros
    description: Semilleros de investigación y su membresía
  - name: Proyectos
    description: Proyectos, productos e hitos
  - name: Eventos
    description: Eventos, convocatorias e inscripciones
  - name: Notificaciones
    description: Centro de actividad del usuario
  - name: Gamificación
    description: Nivel, logros e insignias y ranking
  - name: Admin
    description: Administración (solo rol administrator)
  - name: Soporte
    description: Tickets de ayuda de los usuarios y su gestión administrativa

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registro institucional (acceso inmediato)
      description: >
        Crea un usuario con rol `researcher` y estado `active`. Exige correo
        del dominio institucional (por defecto `unilibre.edu.co`) y contraseña
        de mínimo 8 caracteres. Devuelve un JWT usable de inmediato.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionalRegisterInput"
            examples:
              valido:
                value:
                  email: nuevo.usuario@unilibre.edu.co
                  password: secreto123
                  full_name: Ana María Torres
                  faculty_id: 1
                  program_id: 1
      responses:
        "201":
          description: Usuario creado y activo; token emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/Error400"
        "409":
          description: El correo ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /api/auth/request-account:
    post:
      tags: [Auth]
      summary: Solicitud de cuenta no institucional (pendiente)
      description: >
        Crea un usuario con estado `pending` (sin contraseña utilizable ni
        token). Un administrador deberá aprobarla desde el portal admin
        (feature futuro).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequestInput"
      responses:
        "202":
          description: Solicitud recibida, cuenta pendiente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Error400"
        "409":
          description: El correo ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login con JWT
      responses:
        "200":
          description: Token emitido (expira en 12 h)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          description: >
            Cuenta pendiente ("Solicitud pendiente de aprobación") o rechazada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Identidad del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario activo correspondiente al token
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Falta el header Authorization o el token es inválido/expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /api/auth/catalog:
    get:
      tags: [Catálogo]
      summary: Facultades y programas para los formularios
      responses:
        "200":
          description: Lista de facultades con sus programas anidados
          content:
            application/json:
              schema:
                type: object
                properties:
                  faculties:
                    type: array
                    items:
                      $ref: "#/components/schemas/Faculty"

  /api/profile:
    get:
      tags: [Perfil]
      summary: "Perfil completo del usuario (semilleros, proyectos, publicaciones, productos, gamificación)"
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
    patch:
      tags: [Perfil]
      summary: "Editar nombre, facultad y programa"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200": { description: Operación exitosa }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }

  /api/profile/password:
    post:
      tags: [Perfil]
      summary: "Cambiar contraseña (limitado por IP)"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePassword" }
      responses:
        "204": { description: Operación exitosa }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }

  /api/publications:
    post:
      tags: [Perfil]
      summary: "Registrar una publicación propia"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicationInput" }
      responses:
        "201": { description: Operación exitosa }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }

  /api/dashboard:
    get:
      tags: [Perfil]
      summary: "Resumen del dashboard del investigador"
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }

  /api/posts:
    get:
      tags: [Feed]
      summary: "Listar publicaciones (`category`, `page`)"
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
    post:
      tags: [Feed]
      summary: "Crear publicación (multipart: category, content, link_url, file)"
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }

  /api/posts/{post_id}:
    delete:
      tags: [Feed]
      summary: "Eliminar publicación (autor o administrador)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: post_id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/posts/{post_id}/reactions:
    post:
      tags: [Feed]
      summary: "Alternar reacción"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: post_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/posts/files/{name}:
    get:
      tags: [Feed]
      summary: "Descargar adjunto (JWT por cabecera o `?token=`)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/semilleros:
    get:
      tags: [Semilleros]
      summary: "Listar semilleros (`q`, `faculty_id`, `area`)"
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
    post:
      tags: [Semilleros]
      summary: "Crear semillero (líder o administrador)"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SemilleroInput" }
      responses:
        "201": { description: Operación exitosa }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }

  /api/semilleros/{slug}:
    get:
      tags: [Semilleros]
      summary: "Detalle: equipo, líneas, proyectos, publicaciones, actividades"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/semilleros/{slug}/members:
    post:
      tags: [Semilleros]
      summary: "Vincularse al semillero (notifica al líder)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/semilleros/{slug}/members/me:
    delete:
      tags: [Semilleros]
      summary: "Abandonar el semillero"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/semilleros/{slug}/activities:
    post:
      tags: [Semilleros]
      summary: "Registrar actividad (líder del semillero)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityInput" }
      responses:
        "201": { description: Operación exitosa }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/projects:
    get:
      tags: [Proyectos]
      summary: "Listar proyectos (`q`, `status`, `semillero`, `mine`)"
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
    post:
      tags: [Proyectos]
      summary: "Crear proyecto (quien crea queda como líder)"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201": { description: Operación exitosa }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }

  /api/projects/{slug}:
    get:
      tags: [Proyectos]
      summary: "Detalle de proyecto"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }
    patch:
      tags: [Proyectos]
      summary: "Actualizar estado, avance o descripción (líder)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200": { description: Operación exitosa }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/projects/{slug}/products:
    post:
      tags: [Proyectos]
      summary: "Agregar producto o evidencia (integrantes)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201": { description: Operación exitosa }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/projects/{slug}/milestones/{milestone_id}:
    patch:
      tags: [Proyectos]
      summary: "Completar o reabrir un hito (recalcula el avance)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: milestone_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestoneInput" }
      responses:
        "200": { description: Operación exitosa }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/events:
    get:
      tags: [Eventos]
      summary: "Listar eventos y convocatorias (`kind`, `status`, `q`)"
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
    post:
      tags: [Eventos]
      summary: "Publicar evento o convocatoria (líder o administrador)"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201": { description: Operación exitosa }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }

  /api/events/{slug}:
    get:
      tags: [Eventos]
      summary: "Detalle con estado de participación del usuario"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/events/{slug}/registrations:
    post:
      tags: [Eventos]
      summary: "Inscribirse o postularse (valida cupo y cierre)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/events/{slug}/registrations/me:
    delete:
      tags: [Eventos]
      summary: "Cancelar inscripción o postulación"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/notifications:
    get:
      tags: [Notificaciones]
      summary: "Listar notificaciones (`unread`) con `unread_count`"
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }

  /api/notifications/read-all:
    post:
      tags: [Notificaciones]
      summary: "Marcar todas como leídas"
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }

  /api/notifications/{notification_id}:
    patch:
      tags: [Notificaciones]
      summary: "Marcar una notificación como leída o no leída"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: notification_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationInput" }
      responses:
        "200": { description: Operación exitosa }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/gamification/me:
    get:
      tags: [Gamificación]
      summary: "Nivel, XP, estrellas, insignias y logros propios"
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }

  /api/gamification/ranking:
    get:
      tags: [Gamificación]
      summary: "Ranking de investigadores por XP validada (`limit`)"
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }

  /api/gamification/achievements:
    post:
      tags: [Gamificación]
      summary: "Registrar un logro (queda en revisión)"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AchievementInput" }
      responses:
        "201": { description: Operación exitosa }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }

  /api/admin/overview:
    get:
      tags: [Admin]
      summary: "Métricas globales"
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }

  /api/admin/users:
    get:
      tags: [Admin]
      summary: "Listar usuarios (`status`, `role`, `q`)"
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }

  /api/admin/users/{user_id}:
    patch:
      tags: [Admin]
      summary: "Aprobar o rechazar un usuario (notifica la aprobación)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserStatusInput" }
      responses:
        "200": { description: Operación exitosa }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/admin/achievements:
    get:
      tags: [Admin]
      summary: "Logros por validar (`status`)"
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Operación exitosa }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }

  /api/admin/achievements/{achievement_id}:
    patch:
      tags: [Admin]
      summary: "Validar o rechazar un logro y asignar XP"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: achievement_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AchievementReviewInput" }
      responses:
        "200": { description: Operación exitosa }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }

  /api/admin/analytics:
    get:
      tags: [Admin]
      summary: "Analítica institucional (totales, producción de 12 meses, semilleros por facultad, top por XP, estado de cuentas)"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analytics" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }

  /api/support/tickets:
    get:
      tags: [Soporte]
      summary: "Listar los tickets propios"
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "Operación exitosa: `{items, total}`" }
        "401": { $ref: "#/components/responses/Error401" }
    post:
      tags: [Soporte]
      summary: "Crear un ticket de soporte"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketInput" }
      responses:
        "201": { description: "Ticket creado: `{ticket}` con estado `open`" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }

  /api/admin/support/tickets:
    get:
      tags: [Admin, Soporte]
      summary: "Listar todos los tickets con datos del usuario (`status`)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, in_progress, resolved] } }
      responses:
        "200": { description: "Operación exitosa: `{items, total}`" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }

  /api/admin/support/tickets/{ticket_id}:
    patch:
      tags: [Admin, Soporte]
      summary: "Responder un ticket y/o cambiar su estado (notifica al autor al responder)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketReplyInput" }
      responses:
        "200": { description: "Operación exitosa: `{ticket}`" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Message:
      type: object
      properties:
        message:
          type: string
          example: "Estado de validación: Solicitud pendiente de aprobación."

    User:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
          nullable: true
        email:
          type: string
          format: email
        role:
          type: string
          enum: [researcher, leader, administrator]
        status:
          type: string
          enum: [active, pending, rejected]
        faculty_id:
          type: integer
          nullable: true
        program_id:
          type: integer
          nullable: true

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/User"

    InstitutionalRegisterInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Debe terminar en el dominio institucional configurado
        password:
          type: string
          format: password
          minLength: 8
        full_name:
          type: string
        faculty_id:
          type: integer
          nullable: true
        program_id:
          type: integer
          nullable: true

    AccountRequestInput:
      type: object
      required: [email, full_name, motivation, faculty_id, program_id]
      properties:
        email:
          type: string
          format: email
          description: No debe ser del dominio institucional (ej. gmail)
        full_name:
          type: string
        motivation:
          type: string
          maxLength: 500
        faculty_id:
          type: integer
        program_id:
          type: integer

    Faculty:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        programs:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              faculty_id:
                type: integer

    ProfileUpdate: { type: object, properties: { full_name: { type: string }, faculty_id: { type: integer, nullable: true }, program_id: { type: integer, nullable: true } } }
    ChangePassword: { type: object, required: [current_password, new_password], properties: { current_password: { type: string }, new_password: { type: string, minLength: 8 } } }
    PublicationInput: { type: object, required: [title], properties: { title: { type: string }, venue: { type: string }, published_on: { type: string, format: date }, status: { type: string, enum: [published, in_review] }, semillero: { type: string, description: slug } } }
    SemilleroInput: { type: object, required: [name], properties: { name: { type: string }, area: { type: string }, description: { type: string }, icon: { type: string }, faculty_id: { type: integer }, program_id: { type: integer }, about: { type: string }, mission: { type: string }, vision: { type: string }, interest_areas: { type: array, items: { type: string } }, lines: { type: array, items: { type: object, required: [name], properties: { name: { type: string }, icon: { type: string }, coordinator: { type: string } } } } } }
    ActivityInput: { type: object, required: [title, occurred_on], properties: { title: { type: string }, place: { type: string }, occurred_on: { type: string, format: date } } }
    ProjectInput: { type: object, required: [title], properties: { title: { type: string }, type: { type: string }, status: { type: string, enum: [planned, in_progress, review, completed] }, description: { type: string }, line: { type: string }, role_required: { type: string }, semillero: { type: string, description: slug }, start_date: { type: string, format: date }, end_date: { type: string, format: date }, milestones: { type: array, items: { type: string } } } }
    ProjectUpdate: { type: object, properties: { status: { type: string, enum: [planned, in_progress, review, completed] }, progress: { type: integer, minimum: 0, maximum: 100 }, description: { type: string }, line: { type: string }, end_date: { type: string, format: date, nullable: true } } }
    ProductInput: { type: object, required: [type, name], properties: { type: { type: string }, name: { type: string } } }
    MilestoneInput: { type: object, required: [done], properties: { done: { type: boolean } } }
    EventInput: { type: object, required: [title, starts_at, ends_at], properties: { title: { type: string }, kind: { type: string, enum: [event, call] }, type: { type: string }, description: { type: string }, starts_at: { type: string, format: date-time }, ends_at: { type: string, format: date-time }, location: { type: string }, capacity: { type: integer, minimum: 1, nullable: true }, organizer: { type: string }, requirements: { type: array, items: { type: string } } } }
    NotificationInput: { type: object, required: [read], properties: { read: { type: boolean } } }
    AchievementInput: { type: object, required: [title], properties: { title: { type: string }, description: { type: string }, icon: { type: string }, achieved_on: { type: string, format: date } } }
    AchievementReviewInput: { type: object, required: [status], properties: { status: { type: string, enum: [validated, rejected] }, xp: { type: integer, minimum: 0, maximum: 1000 } } }
    UserStatusInput: { type: object, required: [status], properties: { status: { type: string, enum: [active, pending, rejected] } } }
    TicketInput: { type: object, required: [category, subject, message], properties: { category: { type: string, enum: [technical_bug, feature_request, account_issue, other] }, subject: { type: string, minLength: 3, maxLength: 160 }, message: { type: string, minLength: 10, maxLength: 4000 } } }
    TicketReplyInput: { type: object, description: "Al menos uno de `reply` o `status`", properties: { reply: { type: string, minLength: 1, maxLength: 4000 }, status: { type: string, enum: [open, in_progress, resolved] } } }
    Analytics:
      type: object
      properties:
        totals: { type: object, properties: { publications: { type: integer }, active_projects: { type: integer }, semilleros: { type: integer }, validated_xp: { type: integer } } }
        production: { type: array, description: "12 meses, el más antiguo primero", items: { type: object, properties: { month: { type: string, example: "2026-10" }, publications: { type: integer }, projects: { type: integer } } } }
        semilleros_by_faculty: { type: array, items: { type: object, properties: { faculty: { type: string }, count: { type: integer } } } }
        top_semilleros: { type: array, items: { type: object, properties: { name: { type: string }, faculty: { type: string, nullable: true }, xp: { type: integer } } } }
        account_status: { type: object, properties: { active: { type: integer }, pending: { type: integer }, rejected: { type: integer }, total: { type: integer } } }
  responses:
    Error401: { description: "Token ausente, inválido o cuenta no disponible", content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
    Error403: { description: Permisos insuficientes, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
    Error404: { description: Recurso no encontrado, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
    Error400:
      description: Validación fallida (dominio, contraseña corta, datos faltantes)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
