<!DOCTYPE html>
<html lang="es">

  <link rel="stylesheet" href="css/design-system.css">
</head>
<body class="admin-page">
  <header class="admin-topbar">
    <a class="topnav-brand" href="/admin">RIUL Admin</a>
    <div class="admin-topbar-actions"><span class="label-caps">Panel administrativo</span><button class="icon-action" id="adminLogout" type="button" aria-label="Cerrar sesión" title="Cerrar sesión"><span class="material-symbols-outlined">logout</span></button></div>

  <div class="admin-shell">

    <main class="admin-main" id="adminContent" aria-live="polite"><div class="admin-loading"><span class="material-symbols-outlined">progress_activity</span><span>Verificando permisos...</span></div></main>
