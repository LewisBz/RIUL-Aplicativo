<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIUL - Comunidad</title>
  <link rel="stylesheet" href="css/design-system.css">
</head>
<body data-nav-active="comunidad" style="min-height:100vh;display:flex;flex-direction:column;">

  <!-- Chrome compartido (topnav, menú móvil, sidebar, footer): js/layout.js -->
  <header id="topnavMount"></header>

  <div class="app-shell app-shell-page">

    <aside id="sidenavMount"></aside>

    <!-- Main Content Canvas -->
    <main class="main-content">
      <div class="feed-main">

        <!-- Create Post Box -->
        <section class="create-post-box">
          <span class="avatar avatar-lg" id="composerAvatar"></span>
          <form class="create-post-field" id="createPostForm">
            <textarea class="create-post-textarea" id="postContent" name="content"
              placeholder="¿Qué quieres compartir hoy?" maxlength="5000"></textarea>
            <div class="create-post-preview hidden" id="attachPreview">
              <span class="material-symbols-outlined" style="font-size:18px;">description</span>
              <span id="attachPreviewName"></span>
              <button type="button" id="attachRemove" aria-label="Quitar adjunto">
                <span class="material-symbols-outlined" style="font-size:18px;">close</span>
              </button>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;">
              <button class="btn btn-primary label-caps" type="submit" id="publishBtn">Publicar</button>
            </div>
            <input type="file" id="postFile" accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx" hidden>
          </form>
          <button class="create-post-attach-btn" id="attachBtn" type="button" aria-label="Adjuntar archivo" title="Adjuntar imagen o documento">
            <span class="material-symbols-outlined">image</span>
          </button>
        </section>

        <!-- Filter Chips -->
        <div class="feed-chips" id="categoryChips">
          <span class="label-caps">Categoría:</span>
          <button class="chip-outline" data-category="article" type="button">Artículo</button>
          <button class="chip-outline" data-category="project_advance" type="button">Avance de Proyecto</button>
          <button class="chip-outline" data-category="presentation" type="button">Ponencia</button>
          <button class="chip-outline" data-category="event" type="button">Evento</button>
          <button class="chip-outline active" data-category="community" type="button">Comunidad</button>
        </div>

        <!-- Feed Grid -->
        <section class="feed-grid" id="feedGrid" aria-live="polite"></section>

      </div>
    </main>
  </div>

  <footer id="footerMount"></footer>

  <script type="module" src="js/feed.js"></script>
</body>
</html>
